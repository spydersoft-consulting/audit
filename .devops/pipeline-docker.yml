# Image build & push pipeline for Spydersoft.AuditProcessor + Spydersoft.AuditApi.
#
# This is a placeholder following the structure of the main library pipeline.
# Wire it up to whichever Docker-build template the spydersoft-consulting/azure-devops-templates
# repo provides for .NET service images.
#
# Expected outcome:
#   - feature branches push images tagged feature-<sha>
#   - main pushes images tagged main-<sha> + GitVersion semver
#   - tagged releases push :vX.Y.Z and :latest
#
# Targets:
#   - ghcr.io/spydersoft-consulting/audit-processor   (Dockerfile.processor)
#   - ghcr.io/spydersoft-consulting/audit-api         (Dockerfile.api)

trigger:
  tags:
    include:
      - "*"
  branches:
    include:
      - main
      - feature/*

pr:
  - main

resources:
  repositories:
    - repository: templates
      type: github
      endpoint: spydersoft-gh
      name: spydersoft-consulting/azure-devops-templates

variables:
  - group: ghcr-spydersoft-github

